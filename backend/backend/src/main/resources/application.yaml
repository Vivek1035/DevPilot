spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5433/devpilot
    username: postgres
    password: dbuser
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        # git-hub-models: 
      embedding:
        model: text-embedding-3-small
